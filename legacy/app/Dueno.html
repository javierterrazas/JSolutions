<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --card2:#1f262e; --line:#2b333c; --line2:#3d4854;
    --tx:#e6edf3; --tx2:#8b98a5;
    --ok:#3fb950; --okbg:#0d2b16; --warn:#d29922; --warnbg:#2b2210;
    --bad:#f85149; --badbg:#2d1412; --acc:#4493f8; --accbg:#0d2444;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-size:14.5px;line-height:1.5;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
         padding:13px 18px 0}
  .brand{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px;
         flex-wrap:wrap;gap:8px}
  .brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.2px}
  .brand span{font-size:12.5px;color:var(--tx2)}
  .tabs{display:flex;flex-wrap:wrap;gap:2px}          /* envuelve: nada queda escondido */
  .tabs a{padding:10px 15px;font-size:13.5px;color:var(--tx2);text-decoration:none;
          border-bottom:2px solid transparent;white-space:nowrap;font-weight:600}
  .tabs a.on{color:var(--tx);border-bottom-color:var(--acc)}
  .tabs a b{color:var(--bad);font-weight:700}
  main{padding:20px 18px 40px;max-width:1120px;margin:0 auto}

  .card{background:var(--card);border:1px solid var(--line);border-radius:11px;
        padding:16px;margin-bottom:13px}
  .card h3{margin:0 0 4px;font-size:15.5px;font-weight:700}
  .meta{font-size:12.5px;color:var(--tx2)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:13px}

  /* acciones pendientes: lo primero que ve al abrir */
  .act{display:flex;align-items:center;gap:15px;background:var(--card);border:1px solid var(--line);
       border-left-width:4px;border-radius:11px;padding:15px 17px;margin-bottom:10px;cursor:pointer}
  .act:hover{border-color:var(--line2)}
  .act .n{font-size:30px;font-weight:800;min-width:52px;text-align:center;letter-spacing:-1px}
  .act .t{flex:1}
  .act .t b{display:block;font-size:15px;font-weight:700}
  .act .t span{font-size:12.5px;color:var(--tx2)}
  .act .go{color:var(--tx2);font-size:20px}

  .kpi{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;
       background:var(--card);border:1px solid var(--line);border-radius:11px;
       padding:14px 16px;margin-bottom:9px}
  .kpi .v{font-size:23px;font-weight:800;text-align:right;letter-spacing:-.5px}
  .kpi .n{font-size:14px;font-weight:700}
  .VERDE{color:var(--ok)} .AMBAR{color:var(--warn)} .ROJO{color:var(--bad)} .INFO{color:var(--tx2)}
  .bdr-VERDE{border-left:4px solid var(--ok)} .bdr-AMBAR{border-left:4px solid var(--warn)}
  .bdr-ROJO{border-left:4px solid var(--bad)} .bdr-INFO{border-left:4px solid var(--line2)}

  .pill{display:inline-block;font-size:11.5px;padding:4px 10px;border-radius:20px;font-weight:700;
        background:var(--card2);color:var(--tx2);margin:0 6px 5px 0}
  .pill.ok{background:var(--okbg);color:var(--ok)}
  .pill.warn{background:var(--warnbg);color:var(--warn)}
  .pill.bad{background:var(--badbg);color:var(--bad)}

  label{display:block;font-size:11.5px;color:var(--tx2);margin:13px 0 5px;font-weight:700;
        text-transform:uppercase;letter-spacing:.4px}
  input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);
        color:var(--tx);border-radius:9px;padding:11px;font-size:14.5px;font-family:inherit}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
  textarea{min-height:84px;resize:vertical}
  button{background:var(--acc);color:#04152b;border:0;border-radius:9px;padding:11px 18px;
         font-size:14px;font-weight:700;font-family:inherit;margin-top:13px}
  button.sec{background:var(--card2);border:1px solid var(--line2);color:var(--tx)}
  button.ok{background:var(--ok);color:#052e12} button.bad{background:var(--bad);color:#fff}
  button.sm{padding:8px 13px;font-size:13px;margin:9px 9px 0 0}
  button:disabled{opacity:.5}
  .row{display:flex;gap:11px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--tx2);font-size:11px;text-transform:uppercase;letter-spacing:.4px;
     padding:8px 9px;border-bottom:1px solid var(--line);font-weight:700}
  td{padding:9px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:0}
  .num{text-align:right;font-variant-numeric:tabular-nums}

  /* el margen es el número que importa: que se vea como tal */
  .margen{display:flex;align-items:baseline;gap:9px;margin:13px 0 4px}
  .margen b{font-size:34px;font-weight:800;letter-spacing:-1.2px;line-height:1}
  .margen span{font-size:12.5px;color:var(--tx2)}

  #hVivo{font-size:12px;color:var(--tx2)} #hVivo.off{color:var(--bad)}
  .vivo{display:flex;align-items:center;gap:12px;background:var(--accbg);color:var(--acc);
        border:1px solid var(--acc);border-radius:9px;padding:9px 12px;margin:10px 0 12px;font-size:13px;font-weight:600}
  .vivo span{flex:1} .vivo button{margin:0;padding:7px 13px;font-size:12.5px}
  .toast{position:fixed;right:18px;bottom:18px;background:var(--ok);color:#052e12;padding:14px 18px;
         border-radius:10px;font-weight:700;z-index:60;display:none;max-width:420px;
         box-shadow:0 8px 28px rgba(0,0,0,.45)}
  .toast.err{background:var(--bad);color:#fff}
  .hide{display:none}
  .empty{text-align:center;color:var(--tx2);padding:48px;line-height:1.8}
  .sep{font-size:11.5px;color:var(--tx2);text-transform:uppercase;letter-spacing:.8px;
       margin:26px 0 11px;font-weight:800}
  pre{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:15px;
      white-space:pre-wrap;font-size:12.5px;line-height:1.6;font-family:ui-monospace,Menlo,monospace}
  .quote{border-left:3px solid var(--acc);padding-left:13px;margin-top:9px;font-size:14px}
  .bar{height:7px;background:var(--card2);border-radius:4px;margin:10px 0 5px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--ok)}
  .avance{display:flex;align-items:baseline;gap:10px;margin:12px 0 0}
  .avance b{font-size:38px;font-weight:800;letter-spacing:-1.3px;line-height:1}
  .avance span{font-size:12.5px;color:var(--tx2);line-height:1.3}
  .pila{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--card2);margin:11px 0 14px}
  .pila i{display:block;height:100%}
  .comp{font-size:12.5px;margin-bottom:9px}
  .comp .l{display:flex;justify-content:space-between;margin-bottom:3px}
  .comp .l span{color:var(--tx2)}
  .comp .t{height:6px;border-radius:3px;background:var(--card2)}
  .comp .t i{display:block;height:6px;border-radius:3px}
  .senal{border-radius:8px;padding:8px 10px;font-size:12.5px;margin:0 0 6px}
  .senal.bad{background:var(--badbg);color:var(--bad)}
  .senal.warn{background:var(--warnbg);color:var(--warn)}
  .senal.info{background:var(--card2);color:var(--tx2)}

  .idioma{position:absolute;top:12px;right:14px;width:auto;margin:0;padding:6px 11px;font-size:12.5px;
          font-weight:800;letter-spacing:.5px;border-radius:20px;background:transparent;
          border:2px solid var(--line2, #3d4854);color:var(--tx2, #8b98a5);z-index:5}

  /* Apps Script mete la app dentro de una pagina de Google que tambien se desplaza. Sin esto,
     al llegar al final el gesto se le pasa a la pagina de afuera, y al regresar el dedo queda
     "atrapado" ahi. Tambien evita que un jalon hacia abajo recargue la app a media captura. */
  html,body{overscroll-behavior-y:contain}
  .pinbox{position:relative}
  .pinbox .ojo{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:auto;margin:0;
               padding:10px;background:transparent;border:0;color:var(--tx2, #8b98a5);line-height:0;cursor:pointer}

  label.req::after{content:" *";color:var(--bad);font-weight:700}
  .falta{border-color:var(--bad)!important;box-shadow:0 0 0 1px var(--bad)}

  /* los campos de numero: solo se escribe el numero, sin las flechitas del navegador */
  input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  input[type=number]{ -moz-appearance:textfield; appearance:textfield; }
</style>
</head>

    <p class="meta" id="lMsg" style="text-align:center;margin-top:14px;color:var(--bad)"></p>
  </main>
</div>

function tr(s){
  if(IDIOMA!=='en' || s==null) return s;
  var txt=String(s), m=/^(\s*)([\s\S]*?)(\s*)$/.exec(txt);
  return m[2] ? m[1]+trCuerpo(m[2])+m[3] : txt;
}
function trCuerpo(c){
  if(EN.hasOwnProperty(c)) return EN[c];
  var pre=/^(· |✓ |\+ )([\s\S]+)$/.exec(c);                    // prefijos: "· ", "✓ ", "+ "
  if(pre){ var r=trCuerpo(pre[2]); if(r!==pre[2]) return pre[1]+r; }
  if(c.indexOf(' · ')>0){                                     // "A · B · C": cada parte por su lado
    var hubo=false, t=c.split(' · ').map(function(p){ var x=trCuerpo(p); if(x!==p) hubo=true; return x; });
    if(hubo) return t.join(' · ');
  }
  var n=/^([\s\S]+?) \((\d+)\)$/.exec(c);                     // "Texto (3)"
  if(n){ var r2=trCuerpo(n[1]); if(r2!==n[1]) return r2+' ('+n[2]+')'; }
  for(var i=0;i<EN_PAT.length;i++) if(EN_PAT[i][0].test(c)) return c.replace(EN_PAT[i][0], EN_PAT[i][1]);
  return c;
}
var _orig = new WeakMap(), _puesto = new WeakMap();
function traducirTexto(nodo){
  var p=nodo.parentNode;
  if(!p || /^(SCRIPT|STYLE|TEXTAREA|PRE)$/.test(p.tagName) || (p.closest && p.closest('[data-sin-traducir]'))) return;
  var v=nodo.nodeValue;
  if(!v || !v.trim() || _puesto.get(nodo)===v) return;       // ya lo puse yo: no se retraduce
  var t=tr(v);
  if(t!==v){ if(!_orig.has(nodo)) _orig.set(nodo, v); _puesto.set(nodo, t); nodo.nodeValue=t; }
}
function traducirAtributos(el){
  if(!el.getAttribute) return;
  // una opcion sin value manda su TEXTO al guardar: se congela antes de traducirlo
  if(el.tagName==='OPTION' && !el.hasAttribute('value')) el.setAttribute('value', el.textContent);
  traducirAtributo(el,'placeholder'); traducirAtributo(el,'title'); traducirAtributo(el,'label');
}
var _attrPuesto = new WeakMap();
function traducirAtributo(el, a){
  var v=el.getAttribute && el.getAttribute(a); if(!v) return;
  var puestos=_attrPuesto.get(el)||{};
  if(puestos[a]===v) return;                                   // lo puse yo: no se retraduce
  var t=tr(v); if(t===v) return;
  var o=_orig.get(el)||{}; o[a]=v; _orig.set(el,o);            // el valor que puso el codigo es el original
  puestos[a]=t; _attrPuesto.set(el,puestos); el.setAttribute(a,t);
}
function traducirArbol(raiz){
  if(IDIOMA!=='en' || !raiz) return;
  if(raiz.nodeType===3){ traducirTexto(raiz); return; }
  if(raiz.nodeType!==1 || /^(SCRIPT|STYLE)$/.test(raiz.tagName)) return;
  traducirAtributos(raiz);
  var w=document.createTreeWalker(raiz, 5, null), n;           // 1 = elementos, 4 = textos
  while((n=w.nextNode())){ if(n.nodeType===3) traducirTexto(n); else traducirAtributos(n); }
}
function restaurarArbol(raiz){                                  // de regreso a español
  var w=document.createTreeWalker(raiz, 5, null), n;
  while((n=w.nextNode())){
    if(n.nodeType===3){ if(_orig.has(n)){ n.nodeValue=_orig.get(n); _orig.delete(n); _puesto.delete(n); } }
    else { var o=_orig.get(n); if(o){ for(var a in o) n.setAttribute(a,o[a]); _orig.delete(n); _attrPuesto.delete(n); } }
  }
}

    if(IDIOMA!=='en') return;
    ms.forEach(function(m){

      else if(m.type==='attributes') traducirAtributo(m.target, m.attributeName);
      else for(var i=0;i<m.addedNodes.length;i++) traducirArbol(m.addedNodes[i]);
    });
  }).observe(document.body, { childList:true, subtree:true, characterData:true,
                              attributes:true, attributeFilter:['placeholder','title','label'] });

function formularioSucio(){
  var campos = document.querySelectorAll('#vista input, #vista textarea, #vista select');
  for(var k=0;k<campos.length;k++){ var c=campos[k];
    if(c.type==='hidden' || c.type==='file') continue;
    if(c.tagName==='SELECT'){ for(var j=0;j<c.options.length;j++) if(c.options[j].selected!==c.options[j].defaultSelected) return true; continue; }
    if(c.type==='checkbox' || c.type==='radio'){ if(c.checked!==c.defaultChecked) return true; continue; }
    if(c.value!==c.defaultValue) return true;
  }
  return false;
}

function queCambio(a, b){
  var m = [];
  if(b.bloqueos.length > a.bloqueos.length) m.push('Nuevo aviso de obra');
  if((b.calidadPendiente||[]).length > (a.calidadPendiente||[]).length) m.push('Defectos en un punto de control');
  var ant = {}; a.tablero.forEach(function(t){ ant[t.id]=t; });
  b.tablero.forEach(function(t){
    var v = ant[t.id];
    if(!v){ m.push('Obra nueva · '+t.cliente); return; }
    if(t.ultimoReporte !== v.ultimoReporte) m.push('Cierre de día · '+t.cliente);
    else if(t.materiales > v.materiales) m.push('Gasto nuevo · '+t.cliente);
    else if(t.avance && v.avance && t.avance.pct !== v.avance.pct) m.push('Avance · '+t.cliente);
    else if(t.horasCuadrilla !== v.horasCuadrilla) m.push('Horas de cuadrilla · '+t.cliente);
  });
  if(b.sinRecibo.length > a.sinRecibo.length) m.push('Cargo sin recibo');
  return m.slice(0,2).join(' · ');
}

  google.script.run.withSuccessHandler(function(sello){
    VIVO.ultimo = Date.now(); pintarVivo();
    if(sello && sello !== S.d.sello) traerCambios();
  }).withFailureHandler(function(e){
    if(/Sesion expirada/i.test(String((e&&e.message)||e))){
      VIVO.activo = false; $('hVivo').className='off';
      $('hVivo').textContent = '· sesión expirada, recarga la página';
    }                                      // si es la red, se reintenta en el siguiente ciclo
  }).duSello(S.token);
}
function traerCambios(){
  VIVO.cargando = true;
  google.script.run.withSuccessHandler(function(nuevo){
    VIVO.cargando = false;
    var msg = queCambio(S.d, nuevo);
    if(hayEdicionAbierta()){
      VIVO.pendiente = nuevo; pintarBarraVivo(msg || 'Hay datos nuevos'); return;
    }
    aplicarNuevos(nuevo, msg);
  }).withFailureHandler(function(){ VIVO.cargando = false; }).duDatos(S.token);
}
function aplicarNuevos(nuevo, msg){
  var det = $('detObra');
  var detAbierto = (S.v==='obras' && S.det && det && det.innerHTML.trim()) ? S.det.id : null;
  S.d = nuevo; VIVO.pendiente = null; pintarBarraVivo('');
  if(S.v !== 'historico') render();        // el historico son obras cerradas: no cambia con el campo
  if(detAbierto) detalle(detAbierto, true); // se vuelve a abrir la obra que estabas viendo, sin saltar
  if(msg) toast(msg);
}
function aplicarPendientes(){ if(VIVO.pendiente) aplicarNuevos(VIVO.pendiente, ''); }
function pintarBarraVivo(msg){
  $('vivoBar').innerHTML = msg ? '<div class="vivo"><span>'+esc(msg)+'</span>'+
    '<button onclick="aplicarPendientes()">Actualizar</button></div>' : '';
}
function pintarVivo(){
  if(!VIVO.activo || !VIVO.ultimo) return;
  var s = Math.round((Date.now()-VIVO.ultimo)/1000);
  $('hVivo').className = '';
  $('hVivo').textContent = '· al día '+(s<10?'ahora':'hace '+(s<60?s+' s':Math.round(s/60)+' min'));
}
setInterval(function(){ revisarCambios(false); }, 30000);
setInterval(pintarVivo, 10000);
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='visible') revisarCambios(true);   // al volver a la pestaña, de inmediato
});
function ir(v,ev){ if(ev) ev.preventDefault(); S.v=v; render(); window.scrollTo(0,0); }

var TABS = [['inicio','Inicio'],['obras','Obras'],['avisos','Avisos'],
            ['cambios','Cambios'],['subs','Subcontratos'],['historico','Histórico'],
            ['catalogo','Catálogo']];

function pendientes(d){
  return {
    avisos: d.bloqueos.length,
    avisosSLA: d.bloqueos.filter(function(b){return b.fueraSLA;}).length,
    oc: d.oc.filter(function(o){return o.estado==='Propuesta';}).length,
    ocSLA: d.oc.filter(function(o){return o.estado==='Propuesta'&&o.horasDesdeEmision>48;}).length,
    recibos: d.sinRecibo.length,
    sinReporte: d.tablero.filter(function(t){return t.diasSinReporte!==null&&t.diasSinReporte>2;}).length,
    pagos: d.ordenes.filter(function(o){return o.saldo>0&&o.aprobada;}).length,
    calidad: d.calidadPendiente.length,
    punch: d.punchVencido.length,
    garantia: d.garantiaAbierta.length,
    cosecha: d.cosecha.length,
    rojos: d.kpis.filter(function(k){return k.sem==='ROJO';}).length
  };
}

function render(){
  if(!S.d) return;
  var d=S.d, p=pendientes(d);
  $('tabs').innerHTML = TABS.map(function(t){
    var n = {avisos:p.avisos, cambios:p.oc, subs:p.pagos, inicio:0, obras:0, catalogo:0}[t[0]];
    return '<a href="#" class="'+(S.v===t[0]?'on':'')+'" onclick="ir(\''+t[0]+'\',event)">'+
      t[1]+(n?' <b>'+n+'</b>':'')+'</a>'; }).join('');

  if(S.v==='obras')    v.innerHTML=vObras(d);
  if(S.v==='avisos')   v.innerHTML=vAvisos(d);
  if(S.v==='cambios')  v.innerHTML=vCambios(d);
  if(S.v==='subs')     v.innerHTML=vSubs(d);
  if(S.v==='catalogo'){ v.innerHTML='<div class="card" id="sistema"><h3>Sistema</h3><div class="meta">Cargando…</div></div>'+vCatalogo(d); cargarSistema(); }

function verTarjeta(){ S.verTarjeta=!S.verTarjeta; render(); }
function tarjetaKpi(k){

            (k.fmt==='num1'?(Math.round(k.real*10)/10):Math.round(k.real)));

  return '<div class="kpi bdr-'+k.sem+'"><div><div class="n">'+esc(k.nombre)+'</div>'+
    '<div class="meta">'+esc(k.revela)+(k.sem==='INFO'?'':' · meta '+meta)+'</div></div>'+
    '<div class="v '+k.sem+'">'+val+'</div></div>';
}
function bloqueTarjeta(d){
  if(!d.sinRecibo.length) return '<div class="card"><div class="meta">Todos los cargos tienen recibo.</div></div>';

  return '<div class="card"><h3>'+d.sinRecibo.length+' cargos · '+money(total)+'</h3>'+
    '<div class="meta">Más de '+(d.cfg.HORAS_SIN_RECIBO||72)+' horas sin recibo es KPI rojo.</div>'+
    '<table style="margin-top:11px"><tr><th>Fecha</th><th>Obra</th><th>Proveedor</th>'+
    '<th>Descripción</th><th>PM</th><th>Tarjeta</th><th class="num">Horas</th><th class="num">Monto</th></tr>'+
    d.sinRecibo.map(function(g){
      var tarde=g.horas>(d.cfg.HORAS_SIN_RECIBO||72);
      return '<tr><td>'+esc(g.fecha)+'</td><td>'+esc(g.obra)+'</td><td>'+esc(g.proveedor)+'</td>'+
        '<td>'+esc(g.descripcion)+'</td><td>'+esc(g.pm)+'</td><td>····'+esc(g.tarjeta)+'</td>'+
        '<td class="num '+(tarde?'ROJO':'')+'">'+g.horas+'</td>'+
        '<td class="num">'+money(g.monto)+'</td></tr>'; }).join('')+'</table></div>';

/* --------------------------------------------------- avance ponderado */
function pct0(n){ return Math.round((Number(n)||0)*100)+'%'; }
function bloqueAvance(av){
  var p=av.pct||0, c=av.curso||0;
  return '<div class="avance"><b>'+pct0(p)+'</b><span>de avance'+
      (c>0.005?'<br>+'+pct0(c)+' en curso':'')+'</span></div>'+
    '<div class="pila"><i style="width:'+(p*100)+'%;background:var(--ok)"></i>'+
      '<i style="width:'+(c*100)+'%;background:var(--ok);opacity:.35"></i></div>';
}
function barraComp(etq, val, color){
  var w=Math.max(0,Math.min(100,(val||0)*100));
  return '<div class="comp"><div class="l"><span>'+etq+'</span><b style="color:'+color+'">'+pct0(val)+
    '</b></div><div class="t"><i style="width:'+w+'%;background:'+color+'"></i></div></div>';
}
/**
 * Avance, costo y cobrado lado a lado. La senal esta en la diferencia:
 * costo por delante del avance = sobrecosto; cobrado por detras = financias al cliente.
 */
function comparacion(av, pctCosto, pctCobrado){
  var a=av.pct||0, out='';
  out += barraComp('Avance', a, 'var(--ok)');
  if(pctCosto!==null && pctCosto!==undefined){
    out += barraComp('Costo del presupuesto', pctCosto, pctCosto-a>0.10?'var(--bad)':'var(--tx)');
  }
  out += barraComp('Cobrado del contrato', pctCobrado, a-pctCobrado>0.15?'var(--warn)':'var(--tx)');
  var s='';
  if(pctCosto!==null && pctCosto!==undefined && pctCosto-a>0.10)
    s+='<div class="senal bad">El costo va '+Math.round((pctCosto-a)*100)+' puntos por delante del avance</div>';
  if(a-pctCobrado>0.15)
    s+='<div class="senal warn">Estás financiando al cliente: '+Math.round((a-pctCobrado)*100)+' puntos de avance sin cobrar</div>';
  if(pctCosto===null || pctCosto===undefined)
    s+='<div class="senal info">Captura el presupuesto para comparar el costo contra el avance</div>';
  return out+s;
}

    VIVO.cargando = false;

    var det = (S.v==='obras' && S.det && $('detObra') && $('detObra').innerHTML.trim()) ? S.det : null;
    S.d = nuevo; VIVO.ultimo = Date.now(); VIVO.pendiente = null; pintarBarraVivo('');

function sumaPre(){
  var tot=0; [].forEach.call(document.querySelectorAll('#accObra .pl'), function(e){ tot += Number(e.value)||0; });
  if($('preTot')) $('preTot').textContent = money(tot);
  var c=S.contratoPre||0, el=$('preMar'); if(!el) return;
  if(!tot || !c){ el.innerHTML=''; el.className=''; return; }
  // el riesgo mas serio: capturar precios en lugar de costos; el margen esperado lo delata
  var m=(c-tot)/c, aviso = m<0.10 ? 'muy bajo: ¿capturaste precios en lugar de costos?' : (m>0.70 ? 'muy alto: revisa que no falte alguna etapa' : '');
  el.innerHTML = '<span>Margen esperado:</span> '+pct0(m)+(aviso?' · <span>'+aviso+'</span>':'');
  el.className = aviso ? 'ROJO' : (m<0.30 ? 'AMBAR' : 'VERDE');
}

function flecha(d, inverso){
  if(d===null) return '';
  var bueno = inverso ? d<0 : d>0;
  if(Math.abs(d)<0.001) return ' <span class="meta">igual</span>';
  return ' <span class="'+(bueno?'VERDE':'ROJO')+'" style="font-size:13px">'+
    (d>0?'▲':'▼')+'</span>';
}

/* ------------------------------------------------ cronograma de la obra */
function vCronograma(o){
  var c=o.cronograma; if(!c || !c.filas.length) return '';
  var d0=null, d1=null;
  c.filas.forEach(function(f){ [f.planIni,f.ini].forEach(function(x){ if(!d0||x<d0) d0=x; }); [f.planFin,f.fin].forEach(function(x){ if(!d1||x>d1) d1=x; }); });
  var t0=new Date(d0+'T12:00:00').getTime(), span=Math.max(1,(new Date(d1+'T12:00:00').getTime()-t0)/86400000+1);
  var pos=function(a){ return ((new Date(a+'T12:00:00').getTime()-t0)/86400000)/span*100; };
  var anc=function(a,b){ return Math.max(1.5,((new Date(b+'T12:00:00').getTime()-new Date(a+'T12:00:00').getTime())/86400000+1)/span*100); };
  var hoy=new Date(), hoyP=((new Date(hoy.getFullYear(),hoy.getMonth(),hoy.getDate(),12).getTime()-t0)/86400000)/span*100;
  var tarde=c.prevFin!==c.planFin;
  return '<div class="card"><h3>Cronograma</h3>'+
    '<div class="meta" style="color:'+(tarde?'var(--warn)':'var(--ok)')+'">Entrega prevista '+esc(c.prevFin)+
      (tarde?' · el plan decía '+esc(c.planFin):' · a tiempo con el plan')+'</div>'+
    '<div style="position:relative;margin-top:10px">'+
      (hoyP>=0&&hoyP<=100?'<div style="position:absolute;left:calc(38% + '+(hoyP*0.62)+'%);top:0;bottom:0;border-left:2px solid var(--bad);z-index:1"></div>':'')+
      c.filas.map(function(f,i,arr){
        var cab=(i===0||arr[i-1].area!==f.area)?'<div class="meta" style="font-weight:700;margin:8px 0 2px">'+esc(f.area)+'</div>':'';
        var col=f.estado==='Terminada'?'var(--ok)':(f.fin>f.planFin?'var(--warn)':'var(--acc)');
        return cab+'<div style="display:flex;align-items:center;height:20px;font-size:12px">'+
          '<span style="width:38%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--tx2)">'+esc(f.partida)+'</span>'+
          '<span style="flex:1;position:relative;height:9px">'+
            '<i style="position:absolute;left:'+pos(f.planIni)+'%;width:'+anc(f.planIni,f.planFin)+'%;height:9px;border:1px dashed var(--tx2);border-radius:3px;box-sizing:border-box"></i>'+
            '<i style="position:absolute;left:'+pos(f.ini)+'%;width:'+anc(f.ini,f.fin)+'%;height:9px;background:'+col+';border-radius:3px;opacity:.85"></i>'+
          '</span></div>';
      }).join('')+
    '</div><div class="meta" style="margin-top:8px">Punteado: el plan. Relleno: la previsión — verde terminado, ámbar recorrido.</div></div>';
}

    '<input type="hidden" id="sbId" value="'+esc(s.id)+'">'+
    '<button onclick="guardarSub()">Guardar</button>'+
    '<button class="sec" onclick="document.getElementById(\'formCat\').innerHTML=\'\'">Cancelar</button>'+
    (nuevo?'':'<button class="bad" onclick="activarSub('+i+',false)">Dar de baja</button>')+
    '</div>';
  $('formCat').scrollIntoView({behavior:'smooth'});
}
function guardarSub(){
  enInicio('duGuardarSub', [{ id:$('sbId').value, nombre:$('sbNom').value, oficio:$('sbOf').value,
      contacto:$('sbCon').value, telefono:$('sbTel').value, correo:$('sbMail').value,
      seguroVence:$('sbSeg').value, licencia:$('sbLic').value, licenciaVence:$('sbLicV').value,
      w9:$('sbW9').value==='1', activo:true }], function(r){
    $('formCat').innerHTML=''; ;
    toast(r.avisos && r.avisos.length ? 'Guardado. Ojo: '+r.avisos.join('; ') : 'Subcontratista guardado', !!(r.avisos && r.avisos.length));
  }, function(e){toast(e.message,true);});
}
function activarSub(i, activo){
  var s = S.d.subsCatalogo[i];
  if(!activo && !confirm('¿Dar de baja a '+s.nombre+'? Se conserva su historial y deja de aparecer '+
    'al emitir órdenes nuevas.'+(s.abiertas?' Tiene '+s.abiertas+' orden(es) abierta(s): esas siguen vigentes.':''))) return;
  enInicio('duActivarSub', [s.id, activo], function(){
    $('formCat').innerHTML=''; toast(activo?s.nombre+' reactivado':s.nombre+' dado de baja'); ;
  }, function(e){toast(e.message,true);});
}

function crearTipo(){
  var partidas = $('tPart').value.split('\n').map(function(x){ return x.trim(); }).filter(Boolean);
  enInicio('duCrearTipo', [{ nombre:$('tNom').value, partidas:partidas, pesoTotal:$('tPeso').value }], function(r){
    toast('Tipo creado con '+r.n+' partidas'); S.modoTipo='blanco'; ;
  }, function(e){ toast(e.message,true); });
}
function nuevoHito(){
  $('formCat').innerHTML='<div class="card" style="border-color:var(--acc)">'+
    '<h3>Nuevo punto de control</h3>'+
    '<div class="meta">Un punto de control es una inspección con fotos antes de cubrir o entregar. '+
      'Después de crearlo, asígnalo a las partidas desde Editar partida.</div>'+
    '<label>Nombre del punto de control</label><input id="hNom" placeholder="PC6 Pre-sellado">'+
    '<label>Primer punto a revisar</label><input id="hPunto" placeholder="Base limpia, seca y sin grietas abiertas">'+
    '<label>¿Requiere foto?</label><select id="hFoto"><option value="1">Sí</option><option value="0">No</option></select>'+
    '<button onclick="guardarNuevoHito()">Crear</button>'+
    '<button class="sec" onclick="document.getElementById(\'formCat\').innerHTML=\'\'">Cancelar</button></div>';
  $('formCat').scrollIntoView({behavior:'smooth'});
}
function guardarNuevoHito(){
  var nom = $('hNom').value.trim();
  if(Object.keys(S.d.checklist).some(function(x){ return x.toLowerCase()===nom.toLowerCase(); })){
    toast('Ya existe un punto de control con ese nombre. Agrega sus puntos desde su tarjeta.', true); return;
  }
  enInicio('duGuardarPunto', [{ hito:nom, punto:$('hPunto').value, orden:1, foto:$('hFoto').value==='1' }], function(){
    $('formCat').innerHTML=''; toast('Punto de control creado'); ;
  }, function(e){ toast(e.message,true); });
}
/* ------------------------------------------------ compras de la oficina */

  $('formGasto').innerHTML='<div class="card" style="border-color:var(--acc);margin:0 0 10px">'+
    '<div class="meta">Lo que compra la oficina — gabinetes, appliances — también es costo de la obra.</div>'+
    '<div class="row"><div><label>Monto</label><input id="goMonto" type="number"></div>'+
    '<div><label>Categoría</label><select id="goCat">'+['Material','Renta equipo','Herramienta','Permisos','Disposicion','Otro']
      .map(function(x){return '<option>'+x+'</option>';}).join('')+'</select></div></div>'+
    '<div class="row"><div><label>Proveedor</label><input id="goProv"></div>'+
    '<div><label>Método</label><select id="goMet">'+['Transferencia','Cheque','Tarjeta de la empresa','Efectivo']

    '<label>¿Para qué partida?</label><select id="goPart"><option value="">— sin partida (va a Generales de obra) —</option>'+

}
function guardarGastoOficina(){
  var o=S.det, i=$('goPart').value, x=i===''?null:o.partidas[Number(i)];
  enObra('duGasto', [{ obra:o.id, monto:$('goMonto').value, categoria:$('goCat').value, proveedor:$('goProv').value,
      metodo:$('goMet').value, descripcion:$('goDesc').value, factura:$('goFact').value, partida: x ? x.areaId+'|'+x.partida : '' }], o.id, function(r){ toast('Compra registrada · '+r.id); ; ; }, function(e){toast(e.message,true);});
}
function revisarCompra(i){
  var g=S.d.comprasLimite[i];
  enInicio('duRevisarGasto', [g.id], function(){ toast('Compra revisada'); ; }, function(e){toast(e.message,true);});
}
/* ------------------------------------------------ partidas de esta obra */
function quitarPartidaObra(i){
  var o=S.det, x=o.partidas[i];
  var m=prompt('¿Por qué se quita "'+x.partida+'" de esta obra? (queda registrado)','No se contrató en esta obra');
  if(m===null) return;
  enObra('duQuitarPartidaObra', [o.id, x.areaId, x.partida, m], o.id, function(){ toast('Partida quitada de esta obra'); ; ; }, function(e){toast(e.message,true);});
}
function agregarPartidaObra(i){
  var o=S.det, x=o.partidas[i];
  var n=prompt('Nombre de la partida nueva para '+x.area+' (solo esta obra):',''); if(!n) return;
  var w=prompt('Peso (complejidad). Un baño completo suma 90:','4'); if(w===null) return;
  enObra('duAgregarPartidaObra', [o.id, x.areaId, { partida:n, peso:w }], o.id, function(){ toast('Partida agregada a esta obra'); ; ; }, function(e){toast(e.message,true);});
}
/* ------------------------------------------------ reprogramar una orden */
function formReprogramar(otId, cont){
  var hoy=new Date(), man=new Date(hoy.getTime()+86400000).toISOString().slice(0,10);
  $(cont).innerHTML='<div class="card" style="border-color:var(--acc);margin-top:8px">'+
    '<div class="row"><div><label>Nueva fecha de inicio</label><input id="rpIni" type="date" value="'+man+'"></div>'+
    '<div><label>Nueva fecha de fin</label><input id="rpFin" type="date" value="'+man+'"></div></div>'+
    '<label>Motivo</label><input id="rpMot" placeholder="No llegó; confirmó para mañana a las 8">'+
    '<div class="meta">La nueva fecha pide una nueva confirmación por escrito del sub.</div>'+
    '<button onclick="reprogramarOT(&quot;'+otId+'&quot;)">Reprogramar</button></div>';
}
function reprogramarDesdeInicio(i){ formReprogramar(S.d.subsNoLlegaron[i].ot, 'repInicio'); }
function reprogramarOT(otId){
  enInicio('duReprogramarOT', [otId, { inicio:$('rpIni').value, fin:$('rpFin').value, motivo:$('rpMot').value }], function(r){ toast('Orden reprogramada'+(r.faltas?' · '+r.faltas+' falta(s) registrada(s)':'')); ; }, function(e){toast(e.message,true);});
}

function nuevaPartida(ti,orden){ editarPartida(-1,S.d.tiposObra[ti],orden); }
/* el texto siempre se busca en los datos; nunca viaja dentro de un botón */
function cobrarPunch(i){ var x=S.det.punch[i]; formOC(S.det.id,'',x.item); }
function desdeAviso(i){ var b=S.d.bloqueos[i]; formOC(b.obra,b.id,b.descripcion); }
function editarPartida(idx,tipo,orden){
  var nuevo = idx<0 || idx===undefined;
  var p = nuevo ? {tipo:tipo,orden:orden||99,partida:'',hito:''} : S.d.partidas[idx];
  $('formCat').innerHTML='<div class="card" style="border-color:var(--acc)">'+
    '<h3>'+(nuevo?'Nueva partida':'Editar partida')+'</h3>'+
    '<div class="row"><div><label>Tipo de obra</label><input id="pTipo" value="'+esc(p.tipo)+'"></div>'+
    '<div><label>Orden en la secuencia</label><input id="pOrden" type="number" value="'+p.orden+'"></div>'+
    '<div><label>Peso (complejidad)</label><input id="pPeso" type="number" value="'+(p.peso||1)+'"></div></div>'+
    '<div class="meta">El peso decide cuánto avanza la obra cuando esta partida se termina. '+
      'Un baño completo suma 90; una partida de 18 es 20% del baño.</div>'+
    '<label>Nombre de la partida</label><input id="pNombre" value="'+esc(p.partida)+'">'+
    '<label>Etapa del presupuesto</label><input id="pEtapa" list="pEtapas" value="'+esc(p.etapa||'')+'" placeholder="Acabados">'+
      '<datalist id="pEtapas">'+S.d.partidas.filter(function(x){return x.etapa && (!p.tipo || x.tipo===p.tipo);})
        .map(function(x){return x.etapa;}).filter(function(v,i,a){return a.indexOf(v)===i;})
        .map(function(v){return '<option value="'+esc(v)+'">';}).join('')+'</datalist>'+
    '<div class="row"><div><label>Días hábiles</label><input id="pDias" type="number" value="'+(p.dias||1)+'"></div>'+
    '<div><label>Quién la hace</label><input id="pQuien" list="pQuienes" value="'+esc(p.quien||'Cuadrilla')+'">'+
      '<datalist id="pQuienes"><option value="Cuadrilla"><option value="PM">'+S.d.subs.map(function(s){return '<option value="'+esc(s.oficio)+'">';}).join('')+'</datalist></div>'+
    '<div><label>Días de espera antes</label><input id="pEspera" type="number" value="'+(p.espera||0)+'"></div>'+
    '<div><label>¿Arranca junto con la anterior?</label><select id="pParalelo"><option value="0">No</option>'+
      '<option value="1"'+(p.paralelo?' selected':'')+'>Sí</option></select></div></div>'+
    '<div class="meta">La espera es fabricación: el countertop después de su plantilla. "Quién" con el oficio de un sub '+
      'hace que aparezca en "subs por programar".</div>'+
    '<label>Hito de calidad (opcional)</label>'+
    (function(){                      // solo puntos que existen; uno viejo mal escrito no se pierde de vista
      var hs = Object.keys(S.d.checklist).sort();
      if(p.hito && hs.indexOf(p.hito)<0) hs.unshift(p.hito);
      return '<select id="pHito"><option value="">— sin punto de control —</option>'+
        hs.map(function(x){ return '<option'+(x===p.hito?' selected':'')+'>'+esc(x)+'</option>'; }).join('')+'</select>';
    })()+
    '<input type="hidden" id="pOrig" value="'+esc(nuevo?'':p.partida)+'">'+
    '<input type="hidden" id="pTipoOrig" value="'+esc(nuevo?'':p.tipo)+'">'+
    '<button onclick="guardarPartida()">Guardar</button>'+
    '<button class="sec" onclick="document.getElementById(\'formCat\').innerHTML=\'\'">Cancelar</button>'+
    (nuevo?'':'<button class="bad" onclick="borrarPartida('+idx+')">Borrar</button>')+'</div>';
  $('formCat').scrollIntoView({behavior:'smooth'});
}
function sugerirDuraciones(){
  enInicio('duSugerirDuraciones', [], function(r){ toast('Duraciones sugeridas: '+r.n+' partidas'); ; }, function(e){toast(e.message,true);});
}
function guardarPartida(){
  enInicio('duGuardarPartida', [{ tipo:$('pTipo').value, orden:$('pOrden').value, peso:$('pPeso').value,
      dias:$('pDias').value, quien:$('pQuien').value, espera:$('pEspera').value, paralelo:$('pParalelo').value==='1', etapa:$('pEtapa').value,
      partida:$('pNombre').value, hito:$('pHito').value,
      partidaOriginal:$('pOrig').value, tipoOriginal:$('pTipoOrig').value }], function(){ toast('Catálogo actualizado');
    $('formCat').innerHTML=''; ; }, function(e){toast(e.message,true);});
}
function borrarPartida(idx){
  var p=S.d.partidas[idx];
  if(!confirm('¿Borrar "'+p.partida+'" del catálogo de '+p.tipo+'?')) return;
  enInicio('duBorrarPartida', [p.tipo,p.partida], function(){ toast('Partida borrada');
    $('formCat').innerHTML=''; ; }, function(e){toast(e.message,true);});
}
function clonar(){
  enInicio('duClonarSecuencia', [$('cDesde').value,$('cHacia').value], function(r){ toast('Tipo creado con '+r.n+' partidas'); ; }, function(e){toast(e.message,true);});
}
function editarTrab(idx){
  var t=(idx===undefined||idx<0)
    ? {id:'',nombre:'',puesto:'',tipoPago:'Por hora',tarifa:'',telefono:'',activo:true}
    : S.d.trabajadores[idx];
  $('formCat').innerHTML='<div class="card" style="border-color:var(--acc)">'+
    '<h3>'+(t.id?'Editar trabajador':'Nuevo trabajador')+'</h3>'+
    '<div class="row"><div><label>Nombre</label><input id="tNombre" value="'+esc(t.nombre)+'"></div>'+
    '<div><label>Puesto</label><input id="tPuesto" value="'+esc(t.puesto)+'" placeholder="Oficial de tile"></div></div>'+
    '<div class="row"><div><label>Tipo de pago</label><select id="tPago">'+
      ['Por hora','Por dia'].map(function(o){return '<option'+(o===t.tipoPago?' selected':'')+'>'+o+'</option>';}).join('')+
    '</select></div>'+
    '<div><label>Tarifa</label><input id="tTarifa" type="number" value="'+(t.tarifa||'')+'"></div>'+
    '<div><label>Teléfono</label><input id="tTel" value="'+esc(t.telefono)+'"></div></div>'+
    '<input type="hidden" id="tId" value="'+esc(t.id)+'">'+
    '<button onclick="guardarTrab()">Guardar</button>'+
    '<button class="sec" onclick="document.getElementById(\'formCat\').innerHTML=\'\'">Cancelar</button>'+
    (t.id?'<button class="bad" onclick="bajaTrab(&quot;'+t.id+'&quot;)">Dar de baja</button>':'')+'</div>';
  $('formCat').scrollIntoView({behavior:'smooth'});
}
function guardarTrab(){
  enInicio('duGuardarTrabajador', [{ id:$('tId').value, nombre:$('tNombre').value,
      puesto:$('tPuesto').value, tipoPago:$('tPago').value, tarifa:$('tTarifa').value,
      telefono:$('tTel').value }], function(){ toast('Cuadrilla actualizada');
    $('formCat').innerHTML=''; ; }, function(e){toast(e.message,true);});
}
function bajaTrab(id){
  if(!confirm('¿Dar de baja? Se conserva su historial de horas.')) return;
  enInicio('duBajaTrabajador', [id], function(){ toast('Trabajador dado de baja');
    $('formCat').innerHTML=''; ; }, function(e){toast(e.message,true);});
}

document.addEventListener('keydown',function(e){
  if(e.key==='Enter' && $('login').className===''){ entrar(); }
});
aplicarIdioma(IDIOMA);
</script>
